<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN FESTIVAL 2026 | 官方阵容与乐评数据库</title>
    <style>
        /* ==========================================================================
           1. 核心色彩与变量声明 (完全复刻 image_8dcd25.png 的清爽海岛莫兰迪色系)
           ========================================================================== */
        :root {
            --bg-canvas: #E6F3F7;       /* 大背景：极浅的通透清爽冰蓝色 */
            --card-bg: #FFFFFF;         /* 卡片背景：纯白提升悬浮感 */
            --text-main: #1E3137;       /* 主文本色：深海蓝黑（避免纯黑，极具高级感） */
            --text-muted: #70838A;     /* 辅助文本：清透的灰蓝色 */
            --border-line: #D8ECF0;     /* 极细边框：浅冰蓝色 */
            
            /* 导航栏状态色 */
            --nav-active-bg: #0D637A;   /* 激活状态：海岛深蓝 */
            --nav-inactive-bg: #FFFFFF; /* 未激活状态：纯白 */

            /* 莫兰迪风格标签色系 (背景色与字色同色系深化) */
            --tag-math-bg: #E8F5E9; --tag-math-text: #2E7D32;       /* 浅绿 */
            --tag-prog-bg: #EDE7F6; --tag-prog-text: #5E35B1;       /* 浅紫 */
            --tag-indie-bg: #E3F2FD; --tag-indie-text: #1565C0;      /* 浅蓝 */
            --tag-finger-bg: #FFF3E0; --tag-finger-text: #EF6C00;    /* 浅橙 */
            --tag-post-bg: #FCE4EC; --tag-post-text: #C2185B;        /* 浅粉 */
            --tag-dark-bg: #ECEFF1; --tag-dark-text: #37474F;        /* 浅浅灰 */
        }

        /* ==========================================================================
           2. 基础样式与布局重置
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            padding: 30px 40px;
            letter-spacing: 0.01em;
        }

        .container {
            max-width: 1560px;
            margin: 0 auto;
        }

        /* ==========================================================================
           3. 顶部过滤导航栏 (药丸组件与搜索框样式)
           ========================================================================== */
        .filter-registry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 35px;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* 搜索框 */
        .search-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 380px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            font-size: 0.9rem;
            border: 1px solid var(--border-line);
            border-radius: 30px;
            background-color: rgba(255, 255, 255, 0.7);
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            background-color: #ffffff;
            border-color: var(--nav-active-bg);
            box-shadow: 0 0 0 3px rgba(13, 99, 122, 0.1);
        }

        .search-wrapper::before {
            content: "🔍";
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            opacity: 0.5;
        }

        /* 药丸标签流 */
        .pill-tabs-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pill-tab {
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: 500;
            background-color: var(--nav-inactive-bg);
            border: 1px solid var(--border-line);
            color: var(--text-main);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pill-tab:hover {
            border-color: var(--nav-active-bg);
            color: var(--nav-active-bg);
        }

        .pill-tab.active {
            background-color: var(--nav-active-bg);
            border-color: var(--nav-active-bg);
            color: #FFFFFF;
        }

        .pill-tab .badge-count {
            opacity: 0.6;
            font-size: 0.75rem;
            margin-left: 2px;
        }

        /* ==========================================================================
           4. 网格卡片布局与精致数据区块
           ========================================================================== */
        .database-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
            gap: 30px;
        }

        /* 基础悬浮白色卡片 */
        .app-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid rgba(216, 236, 240, 0.5);
            box-shadow: 0 4px 20px rgba(30, 49, 55, 0.02);
            padding: 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(13, 99, 122, 0.06);
        }

        /* 卡片实拍相册区域 */
        .card-photo-box {
            width: 100%;
            height: 160px;
            background-color: #F0F6F8;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border-line);
        }

        .card-photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 卡片头部与评分 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* 还原图像中的评分小方块 */
        .rating-badge {
            background-color: #E3F2FD;
            color: #0D47A1;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .rating-badge.high { background-color: #E8F5E9; color: #2E7D32; }
        .rating-badge.mid { background-color: #FFF3E0; color: #E65100; }

        .meta-geo-row {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        /* ==========================================================================
           5. 彩色莫兰迪风格标签组件
           ========================================================================== */
        .genre-tags-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
        }

        .genre-tag {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        /* 动态匹配色系 */
        .g-math   { background-color: var(--tag-math-bg); color: var(--tag-math-text); }
        .g-prog   { background-color: var(--tag-prog-bg); color: var(--tag-prog-text); }
        .g-indie  { background-color: var(--tag-indie-bg); color: var(--tag-indie-text); }
        .g-finger { background-color: var(--tag-finger-bg); color: var(--tag-finger-text); }
        .g-post   { background-color: var(--tag-post-bg); color: var(--tag-post-text); }
        .g-dark   { background-color: var(--tag-dark-bg); color: var(--tag-dark-text); }

        /* ==========================================================================
           6. 专辑通栏细条样式 (Albums List)
           ========================================================================== */
        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .album-strip-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 22px;
        }

        .album-strip {
            background-color: #F5FAFC;
            border: 1px solid rgba(216, 236, 240, 0.3);
            border-radius: 6px;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .album-strip .album-left {
            display: flex;
            gap: 14px;
        }

        .album-strip .album-year {
            font-weight: 700;
            color: var(--nav-active-bg);
            width: 35px;
        }

        .album-strip .album-name {
            color: var(--text-main);
            font-weight: 500;
        }

        .album-strip .album-score-box {
            font-size: 0.78rem;
            font-weight: 600;
            background-color: rgba(30, 49, 55, 0.04);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
        }

        /* ==========================================================================
           7. 乐评人折叠组件 & 大事件混合排版
           ========================================================================== */
        .dropdown-panel {
            border: 1px solid var(--border-line);
            border-radius: 6px;
            padding: 12px 14px;
            font-size: 0.85rem;
            background-color: #FFFFFF;
            margin-bottom: 22px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dropdown-panel span.preview {
            color: var(--text-main);
            font-style: italic;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 85%;
        }

        .dropdown-panel::after {
            content: "▼";
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* 大事件图文混合区 */
        .events-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px dashed var(--border-line);
            padding-top: 18px;
            margin-top: auto;
        }

        .event-node {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .event-icon-badge {
            width: 22px;
            height: 22px;
            background-color: #EBF7FA;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .event-text {
            color: var(--text-main);
        }

        .event-tag-link {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 4px;
            display: block;
            text-decoration: underline;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            body { padding: 20px; }
            .database-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

        <div class="pill-tabs-container">
