<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN FESTIVAL 2026 | 极简音乐节官方全阵容指南</title>
    <style>
        /* 1. 核心色彩系统声明 - 完美复刻海报的清新复古岛屿色调 */
        :root {
            --bg-canvas: #F5EFEB;       /* 极简留白：温润清新的羊皮纸底色 */
            --ocean-blue: #5FA2C5;      /* 核心点缀：海报中的清爽海岛蓝 */
            --poppy-pink: #D18FA5;      /* 次要点缀：低饱和度烟粉色 */
            --text-main: #333C3A;       /* 高可读性：深石墨绿/黑，替代纯黑以显高级 */
            --text-muted: #707A78;     /* 辅助信息：清透的灰绿色 */
            --card-bg: #FFFFFF;         /* 卡片背景：纯白提升悬浮感与干净度 */
            --border-line: #E1D7CE;     /* 极简细线：浅卡其色边框 */
            --tag-bg: #FAF6F3;          /* 标签背景：极浅的暖咖色 */
        }

        /* 2. 基础样式重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            letter-spacing: 0.02em;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 3. 头部设计 - 极致留白与清爽线条 */
        header {
            text-align: center;
            padding-bottom: 60px;
            border-bottom: 1px solid var(--border-line);
            margin-bottom: 60px;
        }

        header .festival-badge {
            display: inline-block;
            background-color: var(--ocean-blue);
            color: #FFFFFF;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 2px;
            letter-spacing: 0.15em;
            margin-bottom: 16px;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        header .meta-info {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        header .meta-info span {
            margin: 0 10px;
        }

        /* 4. 阵容网格布局 - 适配丰富信息的大网格 */
        .lineup-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 35px;
        }

        /* 5. 卡片设计 */
        .band-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-line);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .band-card:hover {
            transform: translateY(-5px);
            border-color: var(--ocean-blue);
            box-shadow: 0 15px 35px rgba(95, 162, 197, 0.06);
        }

        /* 乐队实拍照片区域 */
        .band-photo-wrapper {
            position: relative;
            width: 100%;
            height: 240px;
            background-color: #EFE9E4; /* 图片未加载时的极简灰色占位 */
        }

        .band-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 卡片内容区域 */
        .band-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .band-header {
            margin-bottom: 18px;
        }

        .band-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .country-tag {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--ocean-blue);
            border: 1px solid var(--ocean-blue);
            padding: 1px 5px;
            border-radius: 2px;
            letter-spacing: 0.05em;
        }

        .member-count {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .band-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.2;
            margin-top: 4px;
        }

        /* 乐手编制列表 */
        .roles-list {
            list-style: none;
            border-top: 1px solid #F0EAE5;
            padding-top: 14px;
            margin-bottom: 18px;
        }

        .role-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .member-name {
            font-weight: 500;
            color: var(--text-main);
        }

        .member-role {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* 深度扩展板块样式 - 极致可读排版 */
        .info-section {
            margin-bottom: 14px;
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .info-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-title::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background-color: #F2ECE7;
        }

        .review-text {
            color: var(--text-main);
            font-style: italic;
        }

        /* 标签流样式 (乐迷风格 & 相似乐队) */
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .info-tag {
            font-size: 0.75rem;
            background-color: var(--tag-bg);
            color: var(--text-main);
            padding: 2px 8px;
            border-radius: 3px;
            border: 1px solid #ECE4DE;
        }

        .info-tag.sim-band {
            border-left: 2px solid var(--ocean-blue);
        }

        .live-text {
            color: var(--text-main);
            font-weight: 500;
        }

        /* 底部特写附注 */
        .band-note {
            font-size: 0.78rem;
            color: var(--poppy-pink);
            background-color: #FAF4F6;
            padding: 10px 14px;
            border-radius: 4px;
            border-left: 3px solid var(--poppy-pink);
            line-height: 1.4;
            margin-top: auto;
        }

        /* 6. 页脚设计 */
        footer {
            text-align: center;
            margin-top: 80px;
            padding-top: 30px;
            border-top: 1px solid var(--border-line);
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        @media (max-width: 480px) {
            .lineup-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
